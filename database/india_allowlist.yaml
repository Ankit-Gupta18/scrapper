# India company allowlist, used by scripts/import_from_ats_scrapers.py
# to filter the global ATS inventory down to companies that hire for India.
#
# Match semantics: EXACT, case-insensitive, against the CSV `name` OR `slug`.
# Substring matching was tried and flooded with false positives
# ("cred" → "Credal", "apple" → "Apple Roofing"). If a slug differs from the
# common name (e.g. "Razorpay Software Private Limited" → razorpaysoftwareprivatelimited),
# add the slug explicitly as another entry.

