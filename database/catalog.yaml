defaults:
  filters:
    include_locations:
    # India-only. "remote" alone was permitting every global-remote job
    # (GitLab's `location="Remote"`, Stripe's "Remote, Americas") to pass.
    # India-remote postings carry "India" in the location string too, so they
    # still match without "remote" being here.
    - india
    - bengaluru
    - bangalore
    - mumbai
    - hyderabad
    - pune
    - delhi
    - gurgaon
    - noida
    - chennai
    include_titles:
    - engineer
    - developer
    - sde
    - sdet
    - software
    - frontend
    - backend
    - fullstack
    - full stack
    - mts
    - member of technical staff
    exclude_titles:
    # Mid-junior/entry only — mirrors the legacy custom scrapers' choice to
    # drop senior/lead/staff/principal; keeps feed focused on roles typical
    # for 0-5 YOE candidates.
    - intern
    - internship
    - manager
    - director
    - principal
    - staff
    - senior
    - lead
    - vp
    - hardware
    - support
    - qa
    - sr
companies:
# --- Keka (Indian ATS SaaS) ---
# Add rows by subdomain; verified live against minfy.keka.com (92 open postings).
- provider: keka
