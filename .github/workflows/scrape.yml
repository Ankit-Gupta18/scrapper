name: Job scraper

on:
  schedule:
    # Every 2 hours at minute 17 (UTC), only 04:17-18:17 UTC = 09:47-23:47 IST, so nothing is
    # scheduled between 12am and 9am IST. Minute 17 (not 0) because GitHub drops/delays scheduled
    # runs most at the top of the hour. Runs are best-effort and can be late.
    - cron: "17 4-18/2 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline run: save all current jobs as seen WITHOUT sending email (use for the first run)"
        type: boolean
        default: false

# Never run two scrapes at once (they share the jobs.db cache)
concurrency:
  group: job-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Safety net: a scheduled run that GitHub starts late (e.g. 18:17 UTC slot starting after
  # midnight IST) is skipped during quiet hours. Manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          QUIET_START_HOUR_IST: "0"   # inclusive
          QUIET_END_HOUR_IST: "9"     # exclusive -> quiet 12:00am to 8:59am IST
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%-H)
          if [ "$EVENT" = "schedule" ] && [ "$HOUR" -ge "$QUIET_START_HOUR_IST" ] && [ "$HOUR" -lt "$QUIET_END_HOUR_IST" ]; then
            echo "Quiet hours (IST hour $HOUR) - skipping this scheduled run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "IST hour $HOUR - running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAX_WORKERS: "50"
      USE_TELEGRAM: "false"
      DB_PATH: database/jobs.db
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SEND_EMAIL: ${{ inputs.baseline && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # jobs.db remembers which jobs were already emailed. The cache is restored from the
      # newest saved copy and a fresh copy is saved after every run.
      - name: Restore jobs database
        uses: actions/cache/restore@v4
        with:
          path: database/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Run scraper
        run: python main.py

      - name: Save jobs database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: |
            scraper.log
            job_links/
          retention-days: 7
          if-no-files-found: ignore
